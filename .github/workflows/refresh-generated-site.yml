name: Refresh Generated Site

on:
  workflow_dispatch:
  schedule:
    - cron: '30 17 * * *'

permissions:
  contents: write

concurrency:
  group: refresh-generated-site
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh generated site data
        run: npm run generate:refresh-site

      - name: Commit generated changes
        shell: pwsh
        run: |
          if (-not (git diff --quiet -- .)) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "chore: refresh generated site data"
            git push
          } else {
            Write-Output "No generated changes to commit."
          }


